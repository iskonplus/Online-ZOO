<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online ZOO</title>
    <link rel="stylesheet" href="/pages/landing/landing.css">
    <link rel="icon" href="/assets/icons/Favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container header">

            <figure class="wrapper-zoo-logo">
                <a href="#" class="zoo-logo">
                    <img src="/assets/images/Logo.png" alt="zoo-logo">
                </a>
            </figure>

            <nav>
                <ul>
                    <li><a href="">about</a></li>
                    <li><a href="">map</a></li>
                    <li><a href="">zoos</a></li>
                    <li><a href="">contact us</a></li>
                    <li><a href="">design</a></li>
                </ul>
            </nav>


            <div class="block-social-contacts">

                <figure>
                    <a href="https://www.youtube.com/" target="_blank" class="social-link you-tube">
                        <img src="/assets/icons/YouTube.png" alt="YouTube-logo">
                    </a>
                </figure>
                <figure>
                    <a href="https://www.instagram.com/" target="_blank" class="social-link instagram">
                        <img src="/assets/icons/instagram.png" alt="Instagram-logo">
                    </a>
                </figure>
                <figure>
                    <a href="https://www.facebook.com/" target="_blank" class="social-link facebook">
                        <img src="/assets/icons/facebook.png" alt="facebook-logo">
                    </a>
                </figure>

            </div>

            <button class="burger" type="button" aria-label="Open menu">
                <span class="burger__line"></span>
            </button>

        </div>
    </header>

    <section id="favorite">

        <div class="container favorite">
            <h1>Watch your favorite animal online</h1>
            <p>Explore the exciting and mysterious world of wild animals in a natural setting without leaving your home.
            </p>
            <button>VIEW LIVE cam <img src="/assets/icons/arrow-right.png" alt="" class="arrow"></button>
        </div>

    </section>


    <script type="module" src="./landing.js" defer></script>
</body>

</html>
